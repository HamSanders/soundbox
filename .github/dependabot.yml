version: 2
updates:
  # One root lockfile covers every workspace (app, server, site).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # OpenTelemetry's api, sdk and exporters only work at matching
      # versions, so they move together and never mixed into the group below.
      opentelemetry:
        patterns: ["@opentelemetry/*"]
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 13.x publishes no native module for the Node the desktop installers
      # bundle (scripts/desktop-stage.mjs), so the installer build fails.
      # Drop this when a release has a prebuild for that Node.
      - dependency-name: better-sqlite3
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
