name: Pages

# The site lives at https://mirli.app (Vercel, see vercel.json). This keeps the
# old GitHub Pages address, https://hamsanders.github.io/soundbox/, working as a
# permanent redirect to it, so links and search standing carry over.
#
# It builds the site the way Vercel does, then scripts/pages-redirect.mjs swaps
# every page for a stub with a canonical link and an instant meta refresh to the
# same path on mirli.app (what Google accepts as a 301 from a static host).
# Videos, images and other files stay, so hotlinked media keeps working.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "app/src/**"
      - "docs/**"
      - "README.md"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one, but a run
# already deploying is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the site
        run: npm run site:build
        env:
          SITE_ORIGIN: https://mirli.app
      - name: Turn every page into a redirect to mirli.app
        run: node scripts/pages-redirect.mjs site/dist https://mirli.app /soundbox/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
