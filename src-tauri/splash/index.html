<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mirli</title>
    <style>
      /* Standalone on purpose: this page is shown before the real frontend is
         reachable, so it cannot depend on anything the backend serves. The
         palette mirrors app/src/index.css (Mirli noir: cream and dusk, amber
         signal) so the
         launch does not flash a differently-styled window. */
      :root {
        --bg: #f1ece0;
        --fg: #14130f;
        --muted: #5c5850;
        --line: #d9d2c0;
        --signal: #f2a40c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #181817;
          --fg: #f1ece0;
          --muted: #a8a290;
          --line: #35342f;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      .wrap { text-align: center; max-width: 30rem; padding: 2rem; }
      .mark { width: 5.5rem; height: 3.5rem; margin: 0 auto 1.5rem; color: var(--fg); }
      .mark svg { width: 100%; height: 100%; overflow: visible; }
      .mark path {
        fill: none; stroke: currentColor; stroke-width: 14;
        stroke-linecap: round; stroke-linejoin: round;
      }
      body[data-stage="error"] .mark { color: var(--muted); }
      /* Three steps, lit as the backend reports them. */
      .steps { display: flex; gap: 0.5rem; justify-content: center; margin: 1.25rem 0 0; }
      .steps i {
        width: 1.75rem; height: 3px; border-radius: 2px; background: var(--line);
        transition: background 0.3s;
      }
      body[data-stage="starting"] .steps i:nth-child(1),
      body[data-stage="waiting"] .steps i:nth-child(-n+2),
      body[data-stage="ready"] .steps i { background: var(--signal); }
      body[data-stage="error"] .steps { display: none; }
      .tag { font-size: 0.8125rem; color: var(--muted); margin: 0 0 1rem; }
      h1 { font-size: 1rem; font-weight: 600; margin: 0 0 0.375rem; letter-spacing: -0.01em; }
      p {
        font-size: 0.875rem; color: var(--muted); margin: 0;
        line-height: 1.5; white-space: pre-wrap;
      }
      body[data-stage="error"] p { color: var(--fg); }
      .hint { margin-top: 1.25rem; font-size: 0.75rem; color: var(--muted); }
    </style>
  </head>
  <body data-stage="starting">

        </svg>
      </div>
      <h1 id="title">Mirli</h1>
      <p class="tag" id="tag">your AI soundbox</p>
      <p id="status">Starting…</p>
      <div class="steps" aria-hidden="true"><i></i><i></i><i></i></div>
      <p class="hint" id="hint">First launch takes a little longer while models warm up.</p>
    </div>

    <script type="module">
      const { listen } = window.__TAURI__.event;
      const statusEl = document.getElementById("status");
      const titleEl = document.getElementById("title");
      const tagEl = document.getElementById("tag");
      const hintEl = document.getElementById("hint");

      // Rotating tips shown while the backend starts up. Keep each one short
      // enough to fit the 30rem wrap without wrapping awkwardly.
      const tips = [
        "First launch takes a little longer while models warm up.",
        "Tip: describe material, action, and space — \"heavy wooden door slamming in a stone corridor\" beats \"scary sound\".",
        "Tip: models differ in licensing — check before using output commercially.",
        "Tip: generation runs locally, so results stay on this machine.",
        "Tip: you can browse past generations from the library once Mirli opens.",
      ];
      let tipIndex = 0;
      let tipTimer = setInterval(() => {
        if (document.body.dataset.stage === "error") return;
        tipIndex = (tipIndex + 1) % tips.length;
        hintEl.textContent = tips[tipIndex];
      }, 4000);

      // The mark is a looping "M". While we work it morphs into a sound wave,
      // lets the wave run, and folds back into the M. Both shapes are the same
      // number of points, so each frame is a straight blend between the two.
      const wave = document.getElementById("wave");
      const rest = (() => {
        const n = 140;
        const len = wave.getTotalLength();
        return Array.from({ length: n }, (_, i) => {
          const p = wave.getPointAtLength((len * i) / (n - 1));
          return [p.x, p.y];
        });
      })();
      const N = rest.length;
      const HOLD = 1400, OUT = 1100, RUN = 2600, BACK = 1100;
      const CYCLE = HOLD + OUT + RUN + BACK;
      const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

      // A waveform across the same box as the M: a bell-shaped envelope, a few
      // crests that travel, and an amplitude that breathes.
      function sound(i, t) {
        const u = i / (N - 1);
        const env = Math.pow(Math.sin(Math.PI * u), 1.3);
        const amp = 46 * (0.65 + 0.35 * Math.sin(t / 380));
        const y = 64 + env * amp * Math.sin(u * Math.PI * 7 - t / 140);
        return [4 + u * 214, y];
      }

      function draw(mix, t) {
        let d = "";
        for (let i = 0; i < N; i++) {
          const [sx, sy] = sound(i, t);
          const x = rest[i][0] + (sx - rest[i][0]) * mix;
          const y = rest[i][1] + (sy - rest[i][1]) * mix;
          d += (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
        }
        wave.setAttribute("d", d);
      }

      let settling = null; // when set, ease back to the M and stop
      let lastMix = 0;
      function frame(now) {
        let mix;
        if (settling !== null) {
          const k = Math.min(1, (now - settling) / 700);
          mix = lastMix * (1 - ease(k));
          draw(mix, now);
          if (k < 1) requestAnimationFrame(frame);
          return;
        }
        const c = now % CYCLE;
        if (c < HOLD) mix = 0;
        else if (c < HOLD + OUT) mix = ease((c - HOLD) / OUT);
        else if (c < HOLD + OUT + RUN) mix = 1;
        else mix = 1 - ease((c - HOLD - OUT - RUN) / BACK);
        lastMix = mix;
        draw(mix, now);
        requestAnimationFrame(frame);
      }
      if (!reduceMotion) requestAnimationFrame(frame);
      function settle() {
        if (reduceMotion || settling !== null) return;
        settling = performance.now();
      }

      listen("backend-status", (event) => {
        const { stage, message } = event.payload ?? {};
        document.body.dataset.stage = stage ?? "starting";
        if (stage === "ready" || stage === "error") settle();
        if (message) statusEl.textContent = message;
        if (stage === "error") {
          titleEl.textContent = "Mirli could not start";
          tagEl.textContent = "";
          hintEl.textContent = "";
          clearInterval(tipTimer);
        }
      });
    </script>
  </body>
</html>
